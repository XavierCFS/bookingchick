<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教練端學員管理後台</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    
    <!-- 頂部標題與重新整理 -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">🏋‍♂️ 教練端學員管理後台</h1>
        <p class="text-xs text-gray-500 mt-1">即時排課、通知傳送與自主約課權限控制</p>
      </div>
      <button onclick="loadData()" class="bg-white hover:bg-gray-50 text-gray-700 text-sm font-semibold py-2 px-4 border border-gray-300 rounded-xl shadow-sm transition">
        🔄 重新整理
      </button>
    </div>

    <!-- 數據概覽儀表板 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">總學員人數</span>
        <div class="text-3xl font-black text-gray-800 mt-1" id="statStudentCount">--</div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <span class="text-xs font-bold text-green-600 uppercase tracking-wider">總剩餘堂數</span>
        <div class="text-3xl font-black text-green-600 mt-1" id="statRemainingLessons">-- <span class="text-sm font-normal text-gray-400">堂</span></div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">總預收費用</span>
        <div class="text-2xl font-black text-blue-600 mt-1">NT <span id="statTotalRevenue">0</span></div>
      </div>
    </div>

    <!-- 今天與近期排課歷程看板 (支援一鍵變更上課地點) -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 mb-6 p-5">
      <h2 class="font-bold text-gray-800 text-base mb-3 flex items-center justify-between">
        <span>🗓 近期已預約課程看板</span>
        <span class="text-xs font-normal text-gray-400">可在此切換確認地點</span>
      </h2>
      <div id="upcomingBookingList" class="space-y-2 max-h-56 overflow-y-auto">
        <div class="text-center py-4 text-gray-400 text-sm">載入中...</div>
      </div>
    </div>

    <!-- 教練直接幫學員排課區塊 (包含地點選單) -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 mb-6 p-5">
      <h2 class="font-bold text-gray-800 text-base mb-2">✍️ 教練直接幫學員排課</h2>
      <p class="text-xs text-gray-400 mb-4">選取學員、地點與開放時段後自動扣課，並同步建立 Google 行事曆</p>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm mb-4">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">選擇學員 *</label>
          <select id="coachSelectStudent" class="w-full border border-gray-300 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-green-500">
            <option value="">-- 請選擇學員 --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">上課地點 *</label>
          <select id="coachSelectLocation" class="w-full border border-gray-300 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-green-500">
            <option value="賽特體適能中華總店">📍 賽特體適能中華總店</option>
            <option value="賽特體適能同盟店">📍 賽特體適能同盟店</option>
            <option value="待教練確認">❓ 待教練確認</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">選擇開放時段 *</label>
          <select id="coachSelectSlot" class="w-full border border-gray-300 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-green-500">
            <option value="">-- 請選擇時段 --</option>
          </select>
        </div>
      </div>
      <button onclick="submitCoachBooking()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition">
        確定為學員排課 (+自動同步 Google 日曆)
      </button>
    </div>

    <!-- 快速新增學員摺疊區塊 -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 mb-6 overflow-hidden">
      <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center cursor-pointer select-none" onclick="toggleAddForm()">
        <h2 class="font-bold text-gray-700 text-sm">➕ 快速新增學員</h2>
        <span id="formToggleIcon" class="text-gray-400 text-xs">展開 ▼</span>
      </div>
      <div id="addStudentForm" class="hidden p-5 border-t border-gray-100">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">學員姓名 *</label>
            <input type="text" id="newName" placeholder="例如：林小美" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-green-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">專屬 Token (驗證碼) *</label>
            <input type="text" id="newToken" placeholder="可留空自動生成" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">購買總堂數</label>
            <input type="number" id="newTotal" value="10" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">初始剩餘堂數</label>
            <input type="number" id="newRemaining" value="10" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">上課費用 (NT)</label>
            <input type="number" id="newCourseFee" placeholder="15000" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">場地費用 (NT)</label>
            <input type="number" id="newVenueFee" placeholder="2000" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none">
          </div>
        </div>
        <button onclick="submitNewStudent()" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition">
          確認新增學員並寫入試算表
        </button>
      </div>
    </div>

    <!-- 學員名冊搜尋與自主約課權限控制列表 -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-3">
        <h2 class="font-bold text-gray-800 text-lg">👥 學員名冊與約課權限</h2>
        <input type="text" id="searchInput" oninput="filterStudents()" placeholder="🔍 搜尋學員姓名..." class="w-full md:w-64 border border-gray-300 rounded-xl p-2 text-sm outline-none focus:ring-2 focus:ring-green-500">
      </div>

      <div id="studentListContainer" class="space-y-4">
        <div class="text-center py-8 text-gray-400 text-sm">載入學員資料中...</div>
      </div>
    </div>

  </div>

  <script>
    const COACH_LIFF_ID = "2011823687-xpS0rFgS"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycby5pg9LCeT9VC-5qs7lKnoRC6MdJuC6KiRjUjNI53NmFtxCynjbZqK8IWo_nviQDjBF/exec";
    const STUDENT_LIFF_BASE_URL = "https://liff.line.me/2011814195-BxeoylZA";

    let allStudents = [];
    let availableSlots = [];

    async function init() {
      try {
        if (window.liff) await liff.init({ liffId: COACH_LIFF_ID });
      } catch (err) {}
      loadData();
    }

    async function loadData() {
      await loadStudents();
      await loadSlots();
      await loadCoachBookings();
    }

    async function loadStudents() {
      try {
        const res = await fetch(`${GAS_URL}?action=getCoachStudents`);
        const data = await res.json();
        if (data && data.success) {
          allStudents = data.students || [];
          renderDashboard(allStudents);
          renderStudentCards(allStudents);
          populateStudentDropdown(allStudents);
        } else {
          document.getElementById('studentListContainer').innerHTML = `<p class="text-red-500 text-sm py-4 text-center">無法載入：${data ? data.message : '格式錯誤'}</p>`;
        }
      } catch (e) {
        console.error("無法載入學員:", e);
        document.getElementById('studentListContainer').innerHTML = '<p class="text-red-500 text-sm py-4 text-center">網路連線異常，請重新整理</p>';
      }
    }

    async function loadSlots() {
      try {
        const res = await fetch(`${GAS_URL}?action=getAvailableSlots`);
        availableSlots = await res.json();
        populateSlotDropdown(availableSlots);
      } catch (e) {
        console.error("無法載入時段:", e);
      }
    }

    async function loadCoachBookings() {
      const container = document.getElementById('upcomingBookingList');
      try {
        const res = await fetch(`${GAS_URL}?action=getCoachAllBookings`);
        const data = await res.json();
        if (data && data.success) {
          container.innerHTML = '';
          if (!data.upcoming || data.upcoming.length === 0) {
            container.innerHTML = '<p class="text-xs text-gray-400 text-center py-3">近期無已預約課程</p>';
            return;
          }
          
          const now = new Date();
          const y = now.getFullYear();
          const m = String(now.getMonth() + 1).padStart(2, '0');
          const d = String(now.getDate()).padStart(2, '0');
          const todayStr = `${y}/${m}/${d}`;

          const tm = new Date(now.getTime() + 86400000);
          const tmY = tm.getFullYear();
          const tmM = String(tm.getMonth() + 1).padStart(2, '0');
          const tmD = String(tm.getDate()).padStart(2, '0');
          const tomorrowStr = `${tmY}/${tmM}/${tmD}`;

          data.upcoming.forEach(b => {
            let badgeText = "近期";
            let badgeClass = "bg-gray-100 text-gray-600";
            if (b.date === todayStr) {
              badgeText = "🔥 今天";
              badgeClass = "bg-red-100 text-red-700 font-bold";
            } else if (b.date === tomorrowStr) {
              badgeText = "⚡ 明天";
              badgeClass = "bg-amber-100 text-amber-800 font-bold";
            }

            const currentLoc = b.location || '待教練確認';

            const div = document.createElement('div');
            div.className = "flex flex-col sm:flex-row justify-between sm:items-center text-xs p-3 bg-gray-50 rounded-xl border border-gray-100 gap-2";
            div.innerHTML = `
              <div class="flex items-center space-x-2">
                <span class="px-2 py-0.5 rounded-full text-xs ${badgeClass}">${badgeText}</span>
                <span class="font-bold text-gray-800">${b.studentName}</span>
                <span class="text-gray-500">${b.date} ${b.time}</span>
              </div>
              <div class="flex items-center space-x-2">
                <select onchange="changeBookingLocation('${b.bookingId}', this.value)" class="border border-gray-300 rounded-lg p-1 text-xs outline-none bg-white font-medium text-gray-700">
                  <option value="賽特體適能中華總店" ${currentLoc === '賽特體適能中華總店' ? 'selected' : ''}>📍 中華總店</option>
                  <option value="賽特體適能同盟店" ${currentLoc === '賽特體適能同盟店' ? 'selected' : ''}>📍 同盟店</option>
                  <option value="待教練確認" ${currentLoc === '待教練確認' ? 'selected' : ''}>❓ 待確認</option>
                </select>
                <span class="text-gray-400">(${b.bookedBy})</span>
              </div>
            `;
            container.appendChild(div);
          });
        }
      } catch (e) {
        console.error("無法載入預約歷程:", e);
        container.innerHTML = '<p class="text-xs text-gray-400 text-center py-3">載入歷史紀錄失敗</p>';
      }
    }

    async function changeBookingLocation(bookingId, newLoc) {
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateBookingLocation', bookingId: bookingId, location: newLoc })
        });
        const result = await res.json();
        if (result && result.success) {
          alert(`🎉 ${result.message}`);
        } else {
          alert("❌ 切換失敗");
        }
      } catch (e) {
        alert("網路錯誤");
      }
    }

    function populateStudentDropdown(students) {
      const select = document.getElementById('coachSelectStudent');
      select.innerHTML = '<option value="">-- 請選擇學員 --</option>';
      students.forEach(s => {
        select.innerHTML += `<option value="${s.token}">${s.name} (剩餘 ${s.remaining} 堂)</option>`;
      });
    }

    function populateSlotDropdown(slots) {
      const select = document.getElementById('coachSelectSlot');
      select.innerHTML = '<option value="">-- 請選擇時段 --</option>';
      slots.forEach(s => {
        select.innerHTML += `<option value="${s.slotId}">${s.date} ${s.time}</option>`;
      });
    }

    async function submitCoachBooking() {
      const token = document.getElementById('coachSelectStudent').value;
      const slotId = document.getElementById('coachSelectSlot').value;
      const location = document.getElementById('coachSelectLocation').value;

      if (!token || !slotId) {
        alert("請選擇學員與預約時段！");
        return;
      }

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'coachBookSlot', token: token, slotId: slotId, location: location })
        });
        const result = await res.json();

        if (result && result.success) {
          const notifyMsg = `🏋️‍♂️ [課務通知] 教練已為您安排課程！\n📅 時間：${result.date} ${result.time}\n📍 地點：${result.location}\n已自動為您核銷 1 堂課程。`;
          
          if (confirm(`🎉 教練排課成功！\n\n是否複製下方課務通知簡訊傳給 ${result.studentName}？\n\n${notifyMsg}`)) {
            navigator.clipboard.writeText(notifyMsg);
            alert("已複製通知內容！可以直接貼給學員。");
          }
          loadData();
        } else {
          alert(`❌ 排課失敗：${result ? result.message : '未知錯誤'}`);
        }
      } catch (e) {
        alert("網路錯誤，請重試");
      }
    }

    async function togglePermission(studentId, currentAllow) {
      const targetAllow = !currentAllow;
      const confirmMsg = targetAllow ? 
        "確定要開啟該學員的「自主約課」功能嗎？" : 
        "確定要關閉該學員的「自主約課」功能嗎？關閉後學員將無法自行選時段預約。";

      if (!confirm(confirmMsg)) return;

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'toggleSelfBooking', studentId: studentId, allowSelfBooking: targetAllow })
        });
        const result = await res.json();
        if (result && result.success) {
          alert(result.message);
          loadStudents();
        } else {
          alert("❌ 切換失敗：" + (result ? result.message : '未知錯誤'));
        }
      } catch (e) {
        alert("網路連線失敗");
      }
    }

    function renderDashboard(students) {
      document.getElementById('statStudentCount').innerText = students.length;
      const totalRemaining = students.reduce((sum, s) => sum + (Number(s.remaining) || 0), 0);
      document.getElementById('statRemainingLessons').innerText = totalRemaining;
      const totalRevenue = students.reduce((sum, s) => sum + (Number(s.courseFee) || 0) + (Number(s.venueFee) || 0), 0);
      document.getElementById('statTotalRevenue').innerText = totalRevenue.toLocaleString();
    }

    function renderStudentCards(students) {
      const container = document.getElementById('studentListContainer');
      container.innerHTML = '';

      if (students.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm py-6 text-center">目前尚無學員資料。</p>';
        return;
      }

      students.forEach(student => {
        const total = Number(student.total) || 1;
        const remaining = Number(student.remaining) || 0;
        const percent = Math.min(Math.round((remaining / total) * 100), 100);
        const studentLiffLink = `${STUDENT_LIFF_BASE_URL}?token=${encodeURIComponent(student.token)}`;
        const totalFee = (Number(student.courseFee) || 0) + (Number(student.venueFee) || 0);

        const isAllow = student.allowSelfBooking !== false;
        const btnColor = isAllow ? "bg-emerald-100 text-emerald-800 border-emerald-300" : "bg-amber-100 text-amber-800 border-amber-300";
        const btnText = isAllow ? "🟢 自主約課: 開啟中" : "🔴 自主約課: 已關閉";

        const card = document.createElement('div');
        card.className = "border border-gray-200 rounded-xl p-4 hover:border-green-300 transition shadow-sm bg-white";
        card.innerHTML = `
          <div class="flex flex-col md:flex-row justify-between md:items-center gap-3 border-b border-gray-100 pb-3 mb-3">
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-lg font-bold text-gray-800">${student.name}</span>
                <button onclick="togglePermission('${student.studentId}', ${isAllow})" class="text-xs px-2.5 py-0.5 rounded-full border ${btnColor} font-semibold transition">
                  ${btnText}
                </button>
              </div>
              <div class="text-xs text-gray-400 mt-1">Token: <code class="bg-gray-50 px-1 py-0.5 rounded">${student.token}</code></div>
            </div>
            <div class="text-right">
              <span class="text-xs text-gray-500">剩餘 / 總堂數</span>
              <div class="text-lg font-black text-green-700">${remaining} / ${total} <span class="text-xs font-normal text-gray-500">堂</span></div>
            </div>
          </div>

          <div class="w-full bg-gray-100 rounded-full h-2 mb-3 overflow-hidden">
            <div class="bg-green-500 h-2 rounded-full" style="width: ${percent}%"></div>
          </div>

          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs text-gray-600 bg-gray-50 p-2.5 rounded-lg">
            <div>
              上課費: <span class="font-semibold text-gray-800">NT ${Number(student.courseFee).toLocaleString()}</span> | 
              場地費: <span class="font-semibold text-gray-800">NT ${Number(student.venueFee).toLocaleString()}</span> 
              <span class="font-bold text-green-700 ml-1">(總計: NT ${totalFee.toLocaleString()})</span>
            </div>
            <button onclick="copyLiffLink('${studentLiffLink}', '${student.name}')" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-semibold px-3 py-1.5 rounded-lg transition shadow-sm text-xs">
              📋 複製約課連結
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterStudents() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allStudents.filter(s => s.name.toLowerCase().includes(keyword) || String(s.token).toLowerCase().includes(keyword));
      renderStudentCards(filtered);
    }

    function copyLiffLink(link, name) {
      navigator.clipboard.writeText(link).then(() => {
        alert(`已複製【${name}】的專屬 LINE 約課連結！`);
      });
    }

    function toggleAddForm() {
      const form = document.getElementById('addStudentForm');
      form.classList.toggle('hidden');
    }

    async function submitNewStudent() {
      const name = document.getElementById('newName').value.trim();
      let token = document.getElementById('newToken').value.trim();
      if (!name) return alert("請填寫學員姓名！");
      if (!token) token = 'tk_' + Math.floor(Math.random() * 1000000);

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'addStudent',
            name: name,
            token: token,
            total: document.getElementById('newTotal').value,
            remaining: document.getElementById('newRemaining').value,
            courseFee: document.getElementById('newCourseFee').value,
            venueFee: document.getElementById('newVenueFee').value
          })
        });
        const result = await res.json();
        if (result && result.success) {
          alert("🎉 學員新增成功！");
          loadData();
        }
      } catch (e) {
        alert("網路錯誤");
      }
    }

    init();
  </script>
</body>
</html>
