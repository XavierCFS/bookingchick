<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教練課程管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 頁首：標題與教練稱呼 -->
    <div class="flex justify-between items-center bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60">
      <div>
        <h1 class="text-2xl font-black text-slate-800">🏋️‍♂️ 教練課程管理</h1>
        <p class="text-xs font-semibold text-emerald-600 mt-0.5" id="headerCoachInfo">"賽特"教練 (張小明)</p>
      </div>
      <button onclick="loadData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-2xl text-xs transition">
        🔄 重新整理
      </button>
    </div>

    <!-- 1. 學員 Top 3 意願待審核看板 (同一學員合併在同一個框格) -->
    <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-3xl p-6 text-white shadow-xl space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-bold flex items-center space-x-2">
          <i class="fa-solid fa-calendar-check text-emerald-400"></i>
          <span>學員 Top 3 約課意願待審核</span>
        </h2>
        <span class="text-xs bg-white/10 px-3 py-1 rounded-full text-slate-300" id="proposalCountText">0 位學員待審核</span>
      </div>
      <div id="proposalBoard" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="text-slate-400 text-xs py-4 text-center col-span-2">目前尚無等待確認的約課意願。</div>
      </div>
    </div>

    <!-- 2. 學員名單 -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200/60 space-y-4">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
        <h2 class="font-bold text-slate-800 text-lg">👥 學員名單</h2>
        <input type="text" id="searchInput" oninput="filterStudents()" placeholder="🔍 搜尋姓名或電話..." class="w-full md:w-64 bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <div id="studentContainer" class="space-y-4">
        <div class="text-center py-8 text-slate-400 text-xs">載入學員資料中...</div>
      </div>
    </div>

  </div>

  <!-- 學員詳細資料與期數彈窗 (點姓名觸發) -->
  <div id="studentDetailModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl p-6 border border-slate-100 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800" id="mStudentName">學員詳細資料</h3>
        <button onclick="document.getElementById('studentDetailModal').classList.add('hidden')" class="text-slate-400 text-lg">✕</button>
      </div>

      <div class="bg-slate-50 p-3.5 rounded-2xl text-xs space-y-1 text-slate-600">
        <div>🆔 帳號ID：<span id="mStudentId" class="font-bold text-slate-800">--</span></div>
        <div>📞 手機號碼：<span id="mStudentPhone" class="font-bold text-slate-800">--</span></div>
        <div>👤 性別/生日：<span id="mStudentMeta">--</span></div>
      </div>

      <!-- 購買期數明細 -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <h4 class="font-bold text-xs text-slate-800">💳 購買期數明細</h4>
          <button id="mAddPackageBtn" class="bg-blue-600 text-white font-bold px-2.5 py-1 rounded-xl text-xs">➕ 添加新期數</button>
        </div>
        <div id="mPackageList" class="space-y-2 text-xs"></div>
      </div>

      <!-- 備註筆記 -->
      <div class="space-y-2 pt-2 border-t">
        <h4 class="font-bold text-xs text-slate-800">📝 備註筆記</h4>
        <div id="mNoteList" class="bg-slate-50 p-2.5 rounded-xl space-y-1 max-h-28 overflow-y-auto text-xs text-slate-600"></div>
        <div class="flex space-x-2">
          <input type="text" id="mNoteInput" placeholder="新增筆記..." class="flex-1 bg-slate-50 border rounded-xl p-2 text-xs outline-none">
          <button onclick="submitNote()" class="bg-slate-800 text-white font-bold px-3 py-2 rounded-xl text-xs">新增</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 直接新增預約/變更時間彈窗 -->
  <div id="scheduleModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 border border-slate-100 space-y-4">
      <h3 class="text-lg font-bold text-slate-800" id="scheduleModalTitle">📅 安排課程預約</h3>
      <input type="hidden" id="schStudentId">
      <input type="hidden" id="schBookingId">
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-600 mb-1">上課日期 *</label>
          <input type="date" id="schDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none">
        </div>
        <div>
          <label class="block text-slate-600 mb-1">上課時間 *</label>
          <input type="time" id="schTime" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none">
        </div>
        <div>
          <label class="block text-slate-600 mb-1">上課地點 *</label>
          <select id="schLocation" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none">
            <option value="賽特體適能中華總店">📍 賽特體適能中華總店</option>
            <option value="賽特體適能同盟店">📍 賽特體適能同盟店</option>
            <option value="待教練確認">❓ 待教練確認</option>
          </select>
        </div>
      </div>
      <div class="flex space-x-2">
        <button onclick="document.getElementById('scheduleModal').classList.add('hidden')" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">取消</button>
        <button onclick="submitSchedule()" class="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">儲存預約</button>
      </div>
    </div>
  </div>

  <!-- 新增期數彈窗 -->
  <div id="packageModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 border border-slate-100 space-y-4">
      <h3 class="text-lg font-bold text-slate-800">➕ 為學員新增新期數</h3>
      <input type="hidden" id="modalStudentId">
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-600 mb-1">購買堂數 *</label>
          <input type="number" id="pkgLessons" value="10" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none">
        </div>
        <div>
          <label class="block text-slate-600 mb-1">教練費用 (NT\$) *</label>
          <input type="number" id="pkgFee" placeholder="15000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-600 mb-1">付款日期 *</label>
            <input type="date" id="pkgDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none">
          </div>
          <div>
            <label class="block text-slate-600 mb-1">付款方式 *</label>
            <select id="pkgMethod" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none">
              <option value="轉帳">轉帳</option>
              <option value="現金">現金</option>
              <option value="刷卡">刷卡</option>
            </select>
          </div>
        </div>
      </div>
      <div class="flex space-x-2">
        <button onclick="document.getElementById('packageModal').classList.add('hidden')" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">取消</button>
        <button onclick="submitNewPackage()" class="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">確認新增期數</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby5pg9LCeT9VC-5qs7lKnoRC6MdJuC6KiRjUjNI53NmFtxCynjbZqK8IWo_nviQDjBF/exec";
    let dashboardData = null;
    let selectedStudent = null;

    async function loadData() {
      try {
        const res = await fetch(`${GAS_URL}?action=getCoachDashboard`);
        const data = await res.json();
        if (data && data.success) {
          dashboardData = data;
          if (data.coach) {
            document.getElementById('headerCoachInfo').innerText = `"${data.coach.nickname || '賽特'}"教練 (${data.coach.name || '張小明'})`;
          }
          renderProposalsGrouped(data.proposalsGrouped || []);
          renderStudents(data.students || []);
        }
      } catch (e) {
        console.error("Dashboard Load Error:", e);
      }
    }

    // 將同位學員的 Top 3 意願合併在同一個框格卡片
    function renderProposalsGrouped(grouped) {
      const board = document.getElementById('proposalBoard');
      board.innerHTML = '';
      document.getElementById('proposalCountText').innerText = `${grouped.length} 位學員待審核`;

      if (grouped.length === 0) {
        board.innerHTML = '<div class="text-slate-400 text-xs py-4 text-center col-span-2">目前尚無等待確認的約課意願。</div>';
        return;
      }

      grouped.forEach(g => {
        const card = document.createElement('div');
        card.className = "bg-slate-700/60 p-4 rounded-2xl border border-slate-600 space-y-3 text-xs";
        
        let itemsHtml = g.items.map(p => `
          <div class="flex justify-between items-center bg-slate-800/80 p-2.5 rounded-xl border border-slate-600/50">
            <div>
              <span class="font-extrabold text-emerald-400">Top ${p.rank}</span>
              <span class="text-white ml-2 font-semibold">${p.selectedDate} ${p.selectedTime}</span>
              <span class="text-slate-400 ml-1">(${p.location})</span>
            </div>
            <button onclick="confirmProposal('${g.studentId}', '${p.selectedDate}', '${p.selectedTime}', '${p.location}')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-extrabold px-3 py-1 rounded-lg text-xs">
              確認排課
            </button>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-600 pb-2">
            <span class="font-bold text-white text-sm">${g.studentName}</span>
            <span class="text-[10px] bg-slate-600 px-2 py-0.5 rounded-full text-slate-300">ID: ${g.studentId} (${g.studentPhone})</span>
          </div>
          <div class="space-y-2">${itemsHtml}</div>
        `;
        board.appendChild(card);
      });
    }

    // 渲染學員名單卡片 (外部放置「最新一期課程預約」與【➕ 新增預約】)
    function renderStudents(students) {
      const container = document.getElementById('studentContainer');
      container.innerHTML = '';

      students.forEach(s => {
        const sch = s.scheduledBooking;
        let schHtml = '';

        if (sch) {
          schHtml = `
            <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
              <div>
                <span class="font-extrabold text-emerald-800 text-xs">📅 ${sch.date} ${sch.time}</span>
                <span class="text-slate-500 text-xs ml-1">📍 ${sch.location}</span>
              </div>
              <div class="flex space-x-1.5 w-full sm:w-auto">
                <button onclick="openEditSchedule('${sch.bookingId}', '${s.studentId}', '${sch.date}', '${sch.time}', '${sch.location}')" class="flex-1 sm:flex-none bg-white border text-slate-700 font-bold px-2.5 py-1 rounded-xl text-xs">✏️ 變更時間</button>
                <button onclick="completeBooking('${sch.bookingId}', '${s.name}')" class="flex-1 sm:flex-none bg-emerald-600 text-white font-bold px-2.5 py-1 rounded-xl text-xs">✅ 確認完課 (扣1堂)</button>
              </div>
            </div>
          `;
        } else {
          schHtml = `
            <div class="bg-slate-50 border border-slate-200 p-3 rounded-2xl flex justify-between items-center">
              <span class="text-xs text-slate-400 font-bold">無預約</span>
              <button onclick="openNewSchedule('${s.studentId}', '${s.name}')" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-3 py-1.5 rounded-xl text-xs">➕ 新增預約</button>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = "border border-slate-200 rounded-2xl p-4 bg-white space-y-3 shadow-sm";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 pb-2">
            <span onclick="openStudentDetail('${s.studentId}')" class="text-base font-black text-slate-800 cursor-pointer hover:text-emerald-600 underline transition">
              ${s.name}
            </span>
            <span class="text-xs text-slate-400">ID: <code>${s.studentId}</code> (${s.phone})</span>
          </div>
          <div>
            <div class="text-[11px] font-bold text-slate-400 mb-1">最新一期課程預約：</div>
            ${schHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 點擊學員姓名：開啟詳細面版 (包含「購買期數明細」)
    function openStudentDetail(studentId) {
      selectedStudent = dashboardData.students.find(s => s.studentId === studentId);
      if (!selectedStudent) return;

      document.getElementById('mStudentName').innerText = selectedStudent.name;
      document.getElementById('mStudentId').innerText = selectedStudent.studentId;
      document.getElementById('mStudentPhone').innerText = selectedStudent.phone;
      document.getElementById('mStudentMeta').innerText = `${selectedStudent.sex || '未填'} / ${selectedStudent.birthday || '未填'}`;

      document.getElementById('mAddPackageBtn').onclick = () => openPackageModal(selectedStudent.studentId);

      const pkgBox = document.getElementById('mPackageList');
      pkgBox.innerHTML = '';
      if (!selectedStudent.packages || selectedStudent.packages.length === 0) {
        pkgBox.innerHTML = '<p class="text-slate-400">無期數紀錄。</p>';
      } else {
        selectedStudent.packages.forEach(p => {
          pkgBox.innerHTML += `
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex justify-between items-center">
              <div>
                <span class="font-bold text-slate-700">第 ${p.termNumber} 期</span>
                <span class="text-slate-400 ml-1">(${p.paymentDate} ${p.paymentMethod})</span>
              </div>
              <span class="font-black text-emerald-600">剩餘 ${p.remainingLessons} / ${p.totalLessons} 堂 <span class="text-slate-400 font-normal">(NT$ ${p.coachFee.toLocaleString()})</span></span>
            </div>
          `;
        });
      }

      const noteBox = document.getElementById('mNoteList');
      noteBox.innerHTML = '';
      if (!selectedStudent.notes || selectedStudent.notes.length === 0) {
        noteBox.innerHTML = '<p class="text-slate-400">尚無筆記。</p>';
      } else {
        selectedStudent.notes.forEach(n => {
          noteBox.innerHTML += `<div>• ${n.content} <span class="text-[10px] text-slate-400">(${n.createdAt})</span></div>`;
        });
      }

      document.getElementById('studentDetailModal').classList.remove('hidden');
    }

    function openNewSchedule(studentId, name) {
      document.getElementById('schStudentId').value = studentId;
      document.getElementById('schBookingId').value = '';
      document.getElementById('scheduleModalTitle').innerText = `📅 為【${name}】新增預約`;
      document.getElementById('schDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('scheduleModal').classList.remove('hidden');
    }

    function openEditSchedule(bookingId, studentId, date, time, location) {
      document.getElementById('schStudentId').value = studentId;
      document.getElementById('schBookingId').value = bookingId;
      document.getElementById('scheduleModalTitle').innerText = `✏️ 變更預約時間`;
      document.getElementById('schDate').value = date ? date.replace(/\//g, '-') : '';
      document.getElementById('schTime').value = time || '';
      document.getElementById('schLocation').value = location || '賽特體適能中華總店';
      document.getElementById('scheduleModal').classList.remove('hidden');
    }

    async function submitSchedule() {
      const bookingId = document.getElementById('schBookingId').value;
      const studentId = document.getElementById('schStudentId').value;
      const date = document.getElementById('schDate').value;
      const time = document.getElementById('schTime').value;
      const location = document.getElementById('schLocation').value;

      if (!date || !time) return alert("請選擇日期與時間！");

      const action = bookingId ? 'updateBooking' : 'directSchedule';
      const payload = { action, bookingId, studentId, date, time, location };

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if (result && result.success) {
          alert("🎉 " + result.message);
          document.getElementById('scheduleModal').classList.add('hidden');
          loadData();
        }
      } catch (e) {
        alert("操作失敗");
      }
    }

    async function confirmProposal(studentId, date, time, location) {
      const payload = { action: 'confirmProposal', studentId, date, time, location };
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if (result && result.success) {
          alert("🎉 " + result.message);
          loadData();
        }
      } catch (e) { alert("排課失敗"); }
    }

    async function completeBooking(bookingId, studentName) {
      if (!confirm(`確定要為【${studentName}】確認完課並自動扣除 1 堂課嗎？`)) return;
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'completeBooking', bookingId }) });
        const result = await res.json();
        if (result && result.success) {
          alert(result.message);
          loadData();
        } else { alert("❌ " + result.message); }
      } catch (e) { alert("核銷失敗"); }
    }

    function openPackageModal(studentId) {
      document.getElementById('modalStudentId').value = studentId;
      document.getElementById('pkgDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('packageModal').classList.remove('hidden');
    }

    async function submitNewPackage() {
      const payload = {
        action: 'addNewPackage',
        studentId: document.getElementById('modalStudentId').value,
        totalLessons: document.getElementById('pkgLessons').value,
        coachFee: document.getElementById('pkgFee').value,
        paymentDate: document.getElementById('pkgDate').value,
        paymentMethod: document.getElementById('pkgMethod').value
      };
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if (result && result.success) {
          alert("🎉 " + result.message);
          document.getElementById('packageModal').classList.add('hidden');
          document.getElementById('studentDetailModal').classList.add('hidden');
          loadData();
        }
      } catch (e) { alert("新增失敗"); }
    }

    async function submitNote() {
      const content = document.getElementById('mNoteInput').value.trim();
      if (!content || !selectedStudent) return;

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'addStudentNote', studentId: selectedStudent.studentId, content }) });
        const result = await res.json();
        if (result && result.success) {
          document.getElementById('mNoteInput').value = '';
          alert("備註已儲存！");
          document.getElementById('studentDetailModal').classList.add('hidden');
          loadData();
        }
      } catch (e) {}
    }

    loadData();
  </script>
</body>
</html>
