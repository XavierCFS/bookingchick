<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約中心</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div id="app" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
    <!-- 學員資料卡片 -->
    <div class="border-b pb-4 mb-4">
      <h1 class="text-xl font-bold text-gray-800" id="studentName">載入中...</h1>
      <p class="text-sm text-gray-500 mt-1">剩餘堂數：<span id="remaining" class="text-2xl font-extrabold text-green-600">--</span> 堂</p>
    </div>

    <!-- 可約時段列表 -->
    <h2 class="font-bold text-gray-700 mb-2">請選擇可預約時段：</h2>
    <div id="slotList" class="space-y-2 mb-6">
      <p class="text-gray-400 text-sm">搜尋時段中...</p>
    </div>
  </div>

  <script>
    const LIFF_ID = "YOUR_LIFF_ID"; // 替換為你的 LIFF ID
    const GAS_URL = "YOUR_GAS_WEB_APP_URL"; // 替換為你的 GAS 部署 URL

    // 取得 URL 網址參數 (token)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function init() {
      await liff.init({ liffId: LIFF_ID });
      if (!token) {
        alert("無效的學員連結");
        return;
      }
      loadStudentData();
      loadSlots();
    }

    // 載入學員剩餘堂數
    async function loadStudentData() {
      const res = await fetch(`${GAS_URL}?action=getStudentData&token=${token}`);
      const data = await res.json();
      if (data.success) {
        document.getElementById('studentName').innerText = `你好，${data.name}！`;
        document.getElementById('remaining').innerText = data.remaining;
      }
    }

    // 載入可約時段
    async function loadSlots() {
      const res = await fetch(`${GAS_URL}?action=getAvailableSlots`);
      const slots = await res.json();
      const container = document.getElementById('slotList');
      container.innerHTML = '';
      
      slots.forEach(slot => {
        const btn = document.createElement('button');
        btn.className = "w-full bg-green-50 hover:bg-green-100 text-green-700 border border-green-300 font-semibold py-2 px-4 rounded-lg flex justify-between items-center";
        btn.innerHTML = `<span>${slot.date} ${slot.time}</span> <span class="text-xs bg-green-500 text-white px-2 py-1 rounded">可預約</span>`;
        btn.onclick = () => book(slot.slotId, `${slot.date} ${slot.time}`);
        container.appendChild(btn);
      });
    }

    // 點擊預約
    async function book(slotId, timeText) {
      if (!confirm(`確定要預約 ${timeText} 嗎？`)) return;

      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'bookSlot', token: token, slotId: slotId })
      });
      const result = await res.json();

      if (result.success) {
        alert("預約成功！");
        // 自動在私人 LINE 聊天室發送預約紀錄訊息
        if (liff.isLoggedIn() && liff.isInClient()) {
          await liff.sendMessages([{
            type: 'text',
            text: `🤖 [系統紀錄] 我已預約了 ${timeText} 的課程！`
          }]);
        }
        liff.closeWindow(); // 自動關閉 LIFF
      } else {
        alert(result.message);
      }
    }

    init();
  </script>
</body>
</html>
