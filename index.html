<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學員預約中心</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div id="app" class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6">
    
    <!-- 學員姓名與連線狀態 -->
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h1 class="text-xl font-bold text-gray-800" id="studentName">載入中...</h1>
      <span id="statusBadge" class="text-xs bg-green-100 text-green-700 font-medium px-2.5 py-0.5 rounded-full">LINE 連線中</span>
    </div>

    <!-- 最近上課提醒卡片 (含地點與導航行事曆) -->
    <div id="upcomingSection" class="mb-4 p-4 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl text-white shadow-md">
      <div class="flex justify-between items-center mb-2">
        <span id="upcomingBadge" class="text-xs bg-white text-emerald-800 font-extrabold px-2.5 py-0.5 rounded-full">載入中</span>
        <!-- 一鍵加入 Google 日曆按鈕 -->
        <a id="addToCalendarBtn" href="#" target="_blank" class="hidden text-xs bg-white hover:bg-emerald-50 text-emerald-800 font-bold px-3 py-1.5 rounded-lg shadow transition flex items-center space-x-1">
          <span>📅 加 Google 日曆</span>
        </a>
      </div>
      <div class="text-xl font-black mb-1" id="upcomingTime">正在讀取最近上課時間...</div>
      <div class="text-xs opacity-90 flex items-center space-x-1" id="upcomingLocationArea">
        <span>📍 地點：</span>
        <span id="upcomingLocation" class="font-bold underline">待教練確認</span>
      </div>
    </div>

    <!-- 堂數資訊卡片 -->
    <div class="bg-gradient-to-r from-green-50 to-emerald-50 p-4 rounded-2xl border border-green-100 mb-4 shadow-sm">
      <div class="flex justify-between items-center mb-1">
        <span class="text-xs font-semibold text-green-800 uppercase tracking-wider">課程包使用進度</span>
        <span class="text-xs font-bold text-green-600" id="lessonPercentage">--%</span>
      </div>
      <div class="flex justify-between items-baseline mb-2">
        <span class="text-sm font-medium text-gray-600">剩餘堂數 / 總堂數</span>
        <span class="text-2xl font-black text-green-700"><span id="remaining">--</span> / <span id="total">--</span> <span class="text-sm font-normal text-gray-500">堂</span></span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-green-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>

    <!-- 費用明細卡片 -->
    <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 mb-5 text-sm">
      <div class="flex justify-between text-gray-600 mb-1">
        <span>🎓 上課費用</span>
        <span class="font-semibold text-gray-800">NT <span id="courseFee">0</span></span>
      </div>
      <div class="flex justify-between text-gray-600 mb-1">
        <span>🏋️‍♂️ 場地費用</span>
        <span class="font-semibold text-gray-800">NT <span id="venueFee">0</span></span>
      </div>
      <div class="border-t border-gray-200 pt-1.5 flex justify-between font-bold text-gray-900">
        <span>合計總費用</span>
        <span class="text-green-700">NT <span id="totalFee">0</span></span>
      </div>
    </div>

    <!-- 約課區塊 -->
    <div id="bookingSection" class="mb-6">
      <h2 class="font-bold text-gray-800 text-base mb-1">📅 可預約時段：</h2>
      <div id="bookingArea">
        <div class="mb-3">
          <label class="block text-xs font-medium text-gray-600 mb-1">選擇偏好上課地點（選擇後點時段預約）：</label>
          <select id="userSelectLocation" class="w-full border border-gray-300 rounded-xl p-2 text-xs outline-none focus:ring-2 focus:ring-green-500">
            <option value="待教練確認">📍 待教練確認</option>
            <option value="賽特體適能中華總店">📍 賽特體適能中華總店</option>
            <option value="賽特體適能同盟店">📍 賽特體適能同盟店</option>
          </select>
        </div>
        <div id="slotList" class="space-y-2">
          <div class="p-4 bg-gray-50 rounded-xl text-center text-gray-400 text-sm">時段載入中...</div>
        </div>
      </div>
    </div>

    <!-- 歷史約課紀錄歷程 -->
    <div class="border-t pt-4">
      <h3 class="font-bold text-gray-700 text-sm mb-3">📋 上課紀錄歷程</h3>
      <div id="historyList" class="space-y-2 max-h-40 overflow-y-auto">
        <p class="text-xs text-gray-400 text-center py-2">載入紀錄中...</p>
      </div>
    </div>

  </div>

  <script>
    const LIFF_ID = "2011814195-BxeoylZA"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycby5pg9LCeT9VC-5qs7lKnoRC6MdJuC6KiRjUjNI53NmFtxCynjbZqK8IWo_nviQDjBF/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function init() {
      try {
        if (window.liff) await liff.init({ liffId: LIFF_ID });
        if (!token) {
          document.getElementById('studentName').innerText = "⚠️ 連結無效";
          document.getElementById('slotList').innerHTML = '<p class="text-red-500 text-sm py-2">請透過教練傳送的專屬連結開啟預約頁面。</p>';
          return;
        }

        const pBookings = loadBookings();
        const pStudentData = loadStudentData();
        const pSlots = loadSlots();

        await pBookings;
        await Promise.all([pStudentData, pSlots]);
      } catch (err) {
        console.error("LIFF 初始化失敗:", err);
      }
    }

    function cleanDateStr(rawDate) {
      if (!rawDate) return '';
      let str = String(rawDate).trim();
      const d = new Date(str);
      if (!isNaN(d.getTime()) && (str.includes('GMT') || str.includes('T') || str.length > 10)) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }
      return str.replace(/-/g, '/');
    }

    // 產生帶有 Google 地圖導航座標的 Google 行事曆連結
    function generateGoogleCalendarUrl(title, dateStr, timeStr, location, details) {
      try {
        const formattedDate = cleanDateStr(dateStr);
        const parts = formattedDate.split('/');
        if (parts.length < 3) return "#";

        const y = parts[0];
        const m = String(parts[1]).padStart(2, '0');
        const day = String(parts[2]).padStart(2, '0');
        const dateClean = `${y}${m}${day}`;

        const times = String(timeStr).split('-');
        const startTime = times[0] ? times[0].trim() : '00:00';
        const endTime = times[1] ? times[1].trim() : startTime;

        const sParts = startTime.split(':');
        const sH = String(sParts[0] || '00').padStart(2, '0');
        const sM = String(sParts[1] || '00').padStart(2, '0');

        let eH, eM;
        if (times[1] && endTime.includes(':')) {
          const eParts = endTime.split(':');
          eH = String(eParts[0] || '00').padStart(2, '0');
          eM = String(eParts[1] || '00').padStart(2, '0');
        } else {
          eH = String(Number(sH) + 1).padStart(2, '0');
          eM = sM;
        }

        const startIso = `${dateClean}T${sH}${sM}00`;
        const endIso = `${dateClean}T${eH}${eM}00`;

        const baseUrl = "https://calendar.google.com/calendar/render";
        const params = new URLSearchParams({
          action: "TEMPLATE",
          text: title,
          dates: `${startIso}/${endIso}`,
          location: location || '', // 帶入地點，手機打開可直接導航
          details: details || '',
          ctz: "Asia/Taipei"
        });
        return `${baseUrl}?${params.toString()}`;
      } catch (e) {
        return "#";
      }
    }

    async function loadStudentData() {
      try {
        const res = await fetch(`${GAS_URL}?action=getStudentData&token=${token}`);
        const data = await res.json();
        if (data && data.success) {
          document.getElementById('studentName').innerText = `你好，${data.name}！`;
          document.getElementById('remaining').innerText = data.remaining;
          document.getElementById('total').innerText = data.total;

          const total = Number(data.total) || 1;
          const remaining = Number(data.remaining) || 0;
          const percent = Math.min(Math.round((remaining / total) * 100), 100);
          document.getElementById('lessonPercentage').innerText = `${percent}%`;
          document.getElementById('progressBar').style.width = `${percent}%`;

          const course = Number(data.courseFee) || 0;
          const venue = Number(data.venueFee) || 0;
          document.getElementById('courseFee').innerText = course.toLocaleString();
          document.getElementById('venueFee').innerText = venue.toLocaleString();
          document.getElementById('totalFee').innerText = (course + venue).toLocaleString();

          const bookingSec = document.getElementById('bookingSection');
          if (!data.allowSelfBooking) {
            bookingSec.classList.add('hidden');
          } else {
            bookingSec.classList.remove('hidden');
          }
        } else {
          document.getElementById('studentName').innerText = "查無學員資料";
        }
      } catch (e) {
        console.error("無法取得學員資料:", e);
        document.getElementById('studentName').innerText = "載入失敗";
      }
    }

    async function loadBookings() {
      try {
        const res = await fetch(`${GAS_URL}?action=getStudentBookings&token=${token}`);
        const data = await res.json();
        
        if (data && data.success) {
          const upcomingBadge = document.getElementById('upcomingBadge');
          const upcomingTime = document.getElementById('upcomingTime');
          const upcomingLocation = document.getElementById('upcomingLocation');
          const addToCalendarBtn = document.getElementById('addToCalendarBtn');

          if (data.upcoming && data.upcoming.length > 0) {
            const next = data.upcoming[0];
            const displayDate = cleanDateStr(next.date);
            const locText = next.location || '待教練確認';

            upcomingTime.innerText = `${displayDate} ${next.time}`;
            upcomingLocation.innerText = locText;
            
            // 帶入 Location 生成 Google 日曆按鈕
            const calUrl = generateGoogleCalendarUrl(
              "🏋️‍♂️ 私人教練健身課",
              displayDate,
              next.time,
              locText !== '待教練確認' ? locText : '',
              `地點：${locText}\n請準時出席教練課！`
            );
            addToCalendarBtn.href = calUrl;
            addToCalendarBtn.classList.remove('hidden');

            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const todayStr = `${y}/${m}/${d}`;

            const tm = new Date(now.getTime() + 86400000);
            const tmY = tm.getFullYear();
            const tmM = String(tm.getMonth() + 1).padStart(2, '0');
            const tmD = String(tm.getDate()).padStart(2, '0');
            const tomorrowStr = `${tmY}/${tmM}/${tmD}`;

            if (displayDate === todayStr) {
              upcomingBadge.innerText = "🔥 今天上課";
            } else if (displayDate === tomorrowStr) {
              upcomingBadge.innerText = "⚡ 明天上課";
            } else {
              upcomingBadge.innerText = "近期課程";
            }
          } else {
            upcomingBadge.innerText = "提醒";
            upcomingTime.innerText = "尚無預約課程";
            upcomingLocation.innerText = "--";
            addToCalendarBtn.classList.add('hidden');
          }

          const historyContainer = document.getElementById('historyList');
          historyContainer.innerHTML = '';
          const allList = [...(data.upcoming || []), ...(data.past || [])];
          
          if (allList.length === 0) {
            historyContainer.innerHTML = '<p class="text-xs text-gray-400 text-center py-2">尚無上課紀錄</p>';
            return;
          }

          allList.forEach(item => {
            const div = document.createElement('div');
            div.className = "flex justify-between items-center text-xs p-2.5 bg-gray-50 rounded-lg border border-gray-100";
            div.innerHTML = `
              <div>
                <span class="font-bold text-gray-800">${cleanDateStr(item.date)} ${item.time}</span>
                <span class="text-gray-500 ml-1">📍 ${item.location || '待確認'}</span>
              </div>
              <span class="text-green-600 font-semibold">${item.bookedBy}</span>
            `;
            historyContainer.appendChild(div);
          });
        }
      } catch (e) {
        console.error("無法載入紀錄:", e);
        document.getElementById('historyList').innerHTML = '<p class="text-xs text-gray-400 text-center py-2">紀錄載入失敗</p>';
      }
    }

    async function loadSlots() {
      try {
        const res = await fetch(`${GAS_URL}?action=getAvailableSlots`);
        const slots = await res.json();
        const container = document.getElementById('slotList');
        container.innerHTML = '';
        
        if (!slots || slots.length === 0) {
          container.innerHTML = '<p class="text-gray-400 text-sm py-4 text-center">目前無開放預約時段，請聯繫教練。</p>';
          return;
        }

        slots.forEach(slot => {
          const btn = document.createElement('button');
          btn.className = "w-full bg-white hover:bg-green-50 text-gray-800 border border-gray-200 hover:border-green-400 font-semibold py-3 px-4 rounded-xl flex justify-between items-center shadow-sm transition";
          const slotDateStr = cleanDateStr(slot.date);
          btn.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="text-green-600">📅</span>
              <span>${slotDateStr} ${slot.time}</span>
            </div>
            <span class="text-xs bg-green-500 text-white font-medium px-2.5 py-1 rounded-full">預約</span>
          `;
          btn.onclick = () => book(slot.slotId, `${slotDateStr} ${slot.time}`);
          container.appendChild(btn);
        });
      } catch (e) {
        console.error("無法載入時段:", e);
        document.getElementById('slotList').innerHTML = '<p class="text-red-500 text-sm py-2">載入時段失敗</p>';
      }
    }

    async function book(slotId, timeText) {
      const locSelect = document.getElementById('userSelectLocation');
      const chosenLoc = locSelect ? locSelect.value : '待教練確認';

      if (!confirm(`確定要預約 ${timeText} 嗎？\n📍 上課地點：${chosenLoc}`)) return;

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'bookSlot', token: token, slotId: slotId, location: chosenLoc })
        });
        const result = await res.json();

        if (result && result.success) {
          alert("🎉 預約成功！");
          if (liff.isLoggedIn() && liff.isInClient()) {
            await liff.sendMessages([{
              type: 'text',
              text: `🤖 [系統紀錄] 我已預約了 ${timeText} 的課程！\n📍 地點：${chosenLoc}`
            }]);
          }
          liff.closeWindow();
        } else {
          alert(`❌ 預約失敗：${result ? result.message : '未知錯誤'}`);
        }
      } catch (e) {
        alert("網路連線錯誤，請重試");
      }
    }

    init();
  </script>
</body>
</html>
